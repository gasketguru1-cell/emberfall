<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #141a2e; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { visibility: hidden; }
</style>
<script>
/* three.js comes from node_modules when the game is served locally or packed in the desktop app. GitHub Pages has no
   node_modules, so there it loads the same version (0.187.0, as in package-lock) from jsDelivr. */
(function () {
  var base = /\.github\.io$/.test(location.hostname) ? 'https://cdn.jsdelivr.net/npm/three@0.187.0/' : './node_modules/three/';
  document.write('<script type="importmap">' + JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } }) + '<\/script>');
})();
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>           <!-- 3D world (Three.js) -->
  <canvas id="c" width="1280" height="720"></canvas>   <!-- HUD, menus, effects; also the whole picture in 2D mode -->
</div>
<script src="hitboxes.js"></script>
<script src="audio.js"></script>
<script src="sim.js"></script>
<script src="anim.js"></script>
<script src="capesim.js"></script>
<script src="net.js"></script>
<script src="cpu10.js"></script>
<script src="knellcpu.js"></script>
<script src="render2d.js"></script>
<script src="hud.js"></script>
<script src="movelist.js"></script>
<script src="finalhit.js"></script>
<script src="main.js"></script>
<script src="online.js"></script>
<script type="module" src="render3d.js"></script>
</body>
</html>
