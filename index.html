<head>

<title>Emberfall</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #141a2e; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { visibility: hidden; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>           <!-- 3D world (Three.js) -->
  <canvas id="c" width="1280" height="720"></canvas>   <!-- HUD, menus, effects; also the whole picture in 2D mode -->
</div>
<script src="hitboxes.js"></script>
<script src="sim.js"></script>
<script src="anim.js"></script>
<script src="render2d.js"></script>
<script src="hud.js"></script>
<script src="main.js"></script>
<script type="module" src="render3d.js"></script>

</html>
