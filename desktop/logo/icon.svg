<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Emberfall app icon: a falling ember streaking down over a floating island, on a night-forge tile. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f4a"/>
      <stop offset="0.6" stop-color="#171230"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff7a2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ff7a2a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset="0.35" stop-color="#ffc04a"/>
      <stop offset="0.8" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#d93a12"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a52"/>
      <stop offset="1" stop-color="#3b2a24"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a36a"/>
      <stop offset="1" stop-color="#9c6a3e"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ff9a4a" stroke-opacity="0.35" stroke-width="6"/>
  <!-- stars -->
  <g fill="#ffe6c4" opacity="0.7">
    <circle cx="110" cy="112" r="4"/><circle cx="392" cy="96" r="3"/><circle cx="420" cy="190" r="2.5"/><circle cx="88" cy="232" r="2.5"/><circle cx="170" cy="74" r="2"/>
  </g>
  <!-- the trail of the falling ember -->
  <path d="M96 70 C 170 120, 220 170, 262 238 L 290 222 C 240 158, 180 104, 96 70 Z" fill="url(#trail)"/>
  <path d="M60 128 C 130 160, 190 200, 238 262 L 252 250 C 200 196, 140 154, 60 128 Z" fill="url(#trail)" opacity="0.55"/>
  <!-- the floating island -->
  <ellipse cx="256" cy="392" rx="150" ry="22" fill="#000" opacity="0.35"/>
  <path d="M112 348 L 400 348 L 368 380 L 300 446 L 256 470 L 214 446 L 146 380 Z" fill="url(#rock)"/>
  <path d="M104 340 Q 256 318 408 340 L 400 356 Q 256 340 112 356 Z" fill="url(#top)"/>
  <path d="M190 400 L 214 446 M 300 400 L 286 440 M 240 380 L 252 430" stroke="#2a1d18" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- the ember: a flame-tipped drop, glowing -->
  <circle cx="290" cy="262" r="98" fill="url(#glow)"/>
  <path d="M290 186 C 318 222, 344 252, 336 286 C 330 314, 310 330, 288 330 C 262 330, 242 312, 240 288 C 238 262, 256 246, 262 226 C 266 244, 276 252, 282 248 C 290 236, 286 212, 290 186 Z" fill="url(#flame)"/>
  <path d="M290 242 C 302 260, 314 274, 310 292 C 306 306, 298 314, 288 314 C 276 314, 266 304, 266 292 C 266 278, 278 270, 290 242 Z" fill="#fff6d8" opacity="0.85"/>
  <!-- sparks flying off -->
  <g fill="#ffd27a">
    <circle cx="352" cy="232" r="6"/><circle cx="372" cy="270" r="4"/><circle cx="226" cy="236" r="4.5"/><circle cx="350" cy="312" r="3.5"/>
  </g>
</svg>
