<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Emberfall wordmark with the falling-ember mark. Original artwork. -->
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c8"/>
      <stop offset="0.45" stop-color="#ffb84a"/>
      <stop offset="1" stop-color="#e2541a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#120e24"/>
  <path d="M40 40 C 110 80, 150 120, 178 170 L 196 160 C 160 110, 120 74, 40 40 Z" fill="url(#trail)"/>
  <circle cx="200" cy="200" r="90" fill="url(#glow)"/>
  <path d="M200 120 C 228 156, 252 184, 246 218 C 240 246, 222 262, 200 262 C 176 262, 156 246, 154 222 C 152 196, 168 180, 174 160 C 178 178, 188 186, 194 182 C 200 170, 198 146, 200 120 Z" fill="url(#word)"/>
  <text x="300" y="248" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="122" letter-spacing="4" fill="url(#word)" stroke="#5a2410" stroke-width="4" paint-order="stroke">EMBERFALL</text>
  <text x="308" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="38" letter-spacing="16" fill="#c9b8f0" opacity="0.85">A PLATFORM FIGHTER</text>
</svg>
